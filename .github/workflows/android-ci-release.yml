name: Android CI & Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      tag: ${{ steps.pkg.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read & Verify Version
        id: ver
        shell: bash
        run: |
          VER=$(tr -d '\r\n ' < VERSION)
          if [ -z "$VER" ]; then
            echo "::error::VERSION file is empty."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VER" ]]; then
            echo "::error::Tag ${GITHUB_REF} does not match VERSION ${VER}."
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode Release Keystore
        id: keystore
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -z "$SIGNING_KEY_BASE64" ]; then
            echo "::notice::SIGNING_KEY_BASE64 is unavailable on pull_request; skipping release keystore decode (unsigned PR verification build)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=()
          if [ -z "$SIGNING_KEY_BASE64" ]; then missing+=("SIGNING_KEY_BASE64"); fi
          if [ -z "$SIGNING_STORE_PASSWORD" ]; then missing+=("SIGNING_STORE_PASSWORD"); fi
          if [ -z "$SIGNING_KEY_ALIAS" ]; then missing+=("SIGNING_KEY_ALIAS"); fi
          if [ -z "$SIGNING_KEY_PASSWORD" ]; then missing+=("SIGNING_KEY_PASSWORD"); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required signing secret(s) for event '${EVENT_NAME}': ${missing[*]}."
            exit 1
          fi

          umask 077
          if ! printf '%s' "$SIGNING_KEY_BASE64" | tr -d '\r\n ' | base64 -d > app/release.jks 2>/dev/null; then
            rm -f app/release.jks
            echo "::error::Failed to base64-decode SIGNING_KEY_BASE64 into app/release.jks."
            exit 1
          fi
          chmod 600 app/release.jks
          if [ ! -s app/release.jks ]; then
            rm -f app/release.jks
            echo "::error::Decoded app/release.jks is empty."
            exit 1
          fi

          if ! keytool -list -keystore app/release.jks -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null 2>&1; then
            rm -f app/release.jks
            echo "::error::Keystore verification failed for SIGNING_KEY_ALIAS in app/release.jks (verify SIGNING_KEY_BASE64, SIGNING_STORE_PASSWORD, and SIGNING_KEY_ALIAS)."
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Run Unit Tests, Lint & Build Release APK
        shell: bash
        env:
          SIGNING_KEY_FILE: app/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :synctool-sdk:test testDebugUnitTest lintDebug assembleRelease --build-cache --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Clean Up Release Keystore
        if: always()
        shell: bash
        run: rm -f app/release.jks

      - name: Emit Failure Annotations
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/gradle.log" ]; then
            { grep -E 'e: file://|FAILURE:|FAILED|Execution failed|What went wrong|Exception|Unresolved reference|AssertionError|java\.lang\.|Overload resolution|error:' "$RUNNER_TEMP/gradle.log" || true; } \
              | head -n 40 \
              | while IFS= read -r line; do
                  clean="${line//%/%25}"
                  clean="${clean//$'\r'/}"
                  echo "::error::${clean:0:400}"
                done
          fi

      - name: Package Release Artifacts
        id: pkg
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          VER=$(tr -d '\r\n ' < VERSION)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          if [ "$SIGNED" = "true" ]; then
            SRC_APK="app/build/outputs/apk/release/app-release.apk"
            OUT_NAME="GravitySSH-Android-v${VER}-release.apk"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            SRC_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
            OUT_NAME="GravitySSH-Android-v${VER}-unsigned.apk"
            echo "::notice::Packaging unsigned PR build (${OUT_NAME}); release signature verification is skipped on unsigned pull_request."
          else
            echo "::error::Refusing to package unsigned APK on event '${EVENT_NAME}'."
            exit 1
          fi
          if [ ! -f "$SRC_APK" ]; then
            echo "::error::Expected APK not found: ${SRC_APK}"
            exit 1
          fi
          RELEASE_APK="dist/${OUT_NAME}"
          cp "$SRC_APK" "$RELEASE_APK"
          echo "apk_path=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          APK_BYTES=$(stat -c%s "$RELEASE_APK")
          APK_MB=$(awk -v b="$APK_BYTES" 'BEGIN { printf "%.2f", b / 1048576 }')
          echo "Release APK size: ${APK_MB} MB (${APK_BYTES} bytes)"
          (cd dist && sha256sum "$OUT_NAME" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: R8 Release APK Smoke Test
        shell: bash
        env:
          APK_PATH: ${{ steps.pkg.outputs.apk_path }}
          REQUIRE_SIGNED: ${{ steps.keystore.outputs.signed == 'true' || github.event_name != 'pull_request' }}
        run: |
          if [ "$REQUIRE_SIGNED" = "true" ]; then
            APKSIGNER="$(command -v apksigner || true)"
            if [ -z "$APKSIGNER" ]; then
              SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
              if [ -d "$SDK_ROOT/build-tools" ]; then
                APKSIGNER="$({ find "$SDK_ROOT/build-tools" -maxdepth 2 -name apksigner 2>/dev/null || true; } | sort -V | tail -n 1)"
              fi
            fi
            if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
              echo "Verifying APK signature with ${APKSIGNER}..."
              "$APKSIGNER" verify --min-sdk-version 29 "$APK_PATH"
            else
              echo "::warning::apksigner not found under Android SDK build-tools; relying on APK Signing Block v2/v3 inspection."
            fi
          fi

          python3 - <<'PY'
          import os
          import struct
          import sys
          import zipfile

          APK_SIG_BLOCK_MAGIC = b"APK Sig Block 42"
          APK_SIG_SCHEME_IDS = {
              0x7109871A: "v2",
              0xF05368C0: "v3",
              0x1B93AD61: "v3.1",
          }

          def find_apk_sig_schemes(path: str) -> list[str]:
              with open(path, "rb") as f:
                  f.seek(0, os.SEEK_END)
                  file_size = f.tell()
                  if file_size < 22:
                      return []
                  tail_len = min(file_size, 65535 + 22)
                  f.seek(file_size - tail_len)
                  tail = f.read(tail_len)

                  eocd_rel = -1
                  search_from = len(tail) - 22
                  while search_from >= 0:
                      idx = tail.rfind(b"PK\x05\x06", 0, search_from + 4)
                      if idx == -1:
                          break
                      comment_len = struct.unpack_from("<H", tail, idx + 20)[0]
                      if idx + 22 + comment_len == len(tail):
                          eocd_rel = idx
                          break
                      search_from = idx - 1

                  if eocd_rel == -1:
                      return []

                  cd_offset = struct.unpack_from("<I", tail, eocd_rel + 16)[0]
                  if cd_offset < 32:
                      return []

                  f.seek(cd_offset - 24)
                  footer = f.read(24)
                  if len(footer) != 24 or footer[8:] != APK_SIG_BLOCK_MAGIC:
                      return []

                  block_size = struct.unpack_from("<Q", footer, 0)[0]
                  if block_size < 24 or block_size + 8 > cd_offset:
                      return []

                  block_start = cd_offset - block_size - 8
                  f.seek(block_start)
                  header = f.read(8)
                  if len(header) != 8 or struct.unpack_from("<Q", header, 0)[0] != block_size:
                      return []

                  pairs_len = block_size - 24
                  pairs_data = f.read(pairs_len)
                  if len(pairs_data) != pairs_len:
                      return []

                  schemes = []
                  pos = 0
                  while pos + 8 <= pairs_len:
                      pair_len = struct.unpack_from("<Q", pairs_data, pos)[0]
                      pos += 8
                      if pair_len < 4 or pos + pair_len > pairs_len:
                          return []
                      pair_id = struct.unpack_from("<I", pairs_data, pos)[0]
                      if pair_id in APK_SIG_SCHEME_IDS:
                          schemes.append(APK_SIG_SCHEME_IDS[pair_id])
                      pos += pair_len
                  return schemes

          apk_path = os.environ["APK_PATH"]
          require_signed = os.environ.get("REQUIRE_SIGNED", "false").lower() == "true"
          if not os.path.isfile(apk_path):
              sys.exit(f"::error::Release APK not found: {apk_path}")

          with zipfile.ZipFile(apk_path, "r") as zf:
              names = zf.namelist()

              frag_entry = "META-INF/androidx.fragment_fragment.version"
              if frag_entry not in names:
                  sys.exit(f"::error::Missing {frag_entry} in {apk_path}")
              frag_ver = zf.read(frag_entry).decode("utf-8").strip()
              if frag_ver != "1.8.5":
                  sys.exit(f"::error::Expected {frag_entry} == 1.8.5, got {frag_ver!r}")

              pqc_entries = [n for n in names if n.startswith("org/bouncycastle/pqc/")]
              if pqc_entries:
                  sys.exit(f"::error::Unexpected BouncyCastle PQC resources still packaged: {len(pqc_entries)} entries")

              dex_entries = [n for n in names if n.startswith("classes") and n.endswith(".dex")]
              if not dex_entries:
                  sys.exit(f"::error::No classes*.dex entries found in {apk_path}")

              dex_blob = bytearray()
              for dex_name in sorted(dex_entries):
                  info = zf.getinfo(dex_name)
                  if info.compress_type != zipfile.ZIP_DEFLATED:
                      sys.exit(
                          f"::error::Expected {dex_name} to be ZIP_DEFLATED (useLegacyPackaging=true), "
                          f"got compress_type={info.compress_type}"
                      )
                  dex_blob.extend(zf.read(dex_name))

              forbidden_bug = b"Can only use lower 16 bits for requestCode"
              if forbidden_bug in dex_blob:
                  sys.exit("::error::Found forbidden 16-bit requestCode Fragment bug string in release DEX")

              required_bc_markers = [
                  b"Lorg/bouncycastle/jcajce/provider/symmetric/SCRYPT;",
                  b"Lorg/bouncycastle/jcajce/provider/symmetric/SCRYPT$Mappings;",
                  b"Lorg/bouncycastle/jcajce/provider/symmetric/OpenSSLPBKDF;",
                  b"Lorg/bouncycastle/jcajce/provider/symmetric/OpenSSLPBKDF$Mappings;",
                  b"Lorg/bouncycastle/jcajce/provider/symmetric/Blowfish;",
                  b"Lorg/bouncycastle/jcajce/provider/symmetric/Blowfish$Mappings;",
                  b"Lorg/bouncycastle/math/ec/rfc7748/X25519;",
                  b"Lorg/bouncycastle/math/ec/rfc8032/Ed25519;",
              ]
              missing = [m.decode("ascii") for m in required_bc_markers if m not in dex_blob]
              if missing:
                  sys.exit(f"::error::R8 stripped required BouncyCastle classes from release DEX: {', '.join(missing)}")

              sig_schemes = find_apk_sig_schemes(apk_path)
              has_v1 = any(n.startswith("META-INF/") and n.endswith(".SF") for n in names)
              if has_v1 and "v1" not in sig_schemes:
                  sig_schemes.insert(0, "v1")
              if require_signed and not sig_schemes:
                  sys.exit(f"::error::Release APK is unsigned (no APK Signing Block v2/v3 or v1 JAR signature found): {apk_path}")

              sig_summary = "+".join(sig_schemes) if sig_schemes else "unsigned(pr)"
              print(
                  f"R8 Release APK Smoke Test PASSED: {apk_path} "
                  f"(fragment={frag_ver}, dex_files={len(dex_entries)}, compressed_dex=true, "
                  f"pqc_resources=0, bc_providers=ok, signing={sig_summary})"
              )
          PY

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gravityssh-android-v${{ steps.pkg.outputs.version }}
          path: dist/*

  release:
    needs: build
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: release-pipeline
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check Existing Release Tag
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VER" ]]; then
            echo "::error::Tag ${GITHUB_REF} does not match VERSION ${VER}."
            exit 1
          fi
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
              echo "Release ${TAG} already exists; skipping automatic release on main."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download Build Artifacts
        if: steps.check.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: gravityssh-android-v${{ needs.build.outputs.version }}
          path: dist

      - name: Publish GitHub Release
        if: steps.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GravitySSH Android ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/GravitySSH-Android-v${{ needs.build.outputs.version }}-release.apk
            dist/SHA256SUMS.txt
