name: Android CI & Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      tag: ${{ steps.pkg.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch Smiley Sans Font
        run: python3 scripts/fetch_fonts.py

      - name: Prepare Release Keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASS_KEY: ${{ secrets.ANDROID_KEY_PASS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret is not configured; falling back to an ephemeral signing keystore. Configure ANDROID_KEYSTORE_B64 for consistent release upgrade signatures."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" \
              -storepass gravityssh -keypass gravityssh -alias gravityssh \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=GravitySSH, OU=Mobile, O=GravitySSH, L=Net, S=Net, C=US"
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASS=${ANDROID_KEYSTORE_PASS:-gravityssh}" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_ALIAS=${ANDROID_KEYSTORE_ALIAS:-gravityssh}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASS=${ANDROID_KEY_PASS:-gravityssh}" >> "$GITHUB_ENV"

      - name: Run Unit Tests & Build Release APK
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleRelease --build-cache --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Emit Failure Annotations
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/gradle.log" ]; then
            { grep -E 'e: file://|FAILURE:|FAILED|Execution failed|What went wrong|Exception|Unresolved reference|AssertionError|java\.lang\.|Overload resolution|error:' "$RUNNER_TEMP/gradle.log" || true; } \
              | head -n 40 \
              | while IFS= read -r line; do
                  clean="${line//%/%25}"
                  clean="${clean//$'\r'/}"
                  echo "::error::${clean:0:400}"
                done
          fi

      - name: Package Release Artifacts
        id: pkg
        shell: bash
        run: |
          VER=$(tr -d '\r\n ' < VERSION)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          RELEASE_APK="dist/GravitySSH-Android-v${VER}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RELEASE_APK"
          APK_BYTES=$(stat -c%s "$RELEASE_APK")
          APK_MB=$(awk -v b="$APK_BYTES" 'BEGIN { printf "%.2f", b / 1048576 }')
          echo "Release APK size: ${APK_MB} MB (${APK_BYTES} bytes)"
          (cd dist && sha256sum "GravitySSH-Android-v${VER}-release.apk" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gravityssh-android-v${{ steps.pkg.outputs.version }}
          path: dist/*

  release:
    needs: build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check Existing Release Tag
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if gh api "repos/${{ github.repository }}/releases/tags/${TAG}" >/dev/null 2>&1; then
              echo "Release ${TAG} already exists; skipping automatic release on main."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download Build Artifacts
        if: steps.check.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: gravityssh-android-v${{ needs.build.outputs.version }}
          path: dist

      - name: Publish GitHub Release
        if: steps.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GravitySSH Android ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/GravitySSH-Android-v${{ needs.build.outputs.version }}-release.apk
            dist/SHA256SUMS.txt
