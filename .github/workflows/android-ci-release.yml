name: Android CI & Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      tag: ${{ steps.pkg.outputs.tag }}
      ephemeral_signing: ${{ steps.keystore.outputs.ephemeral }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read & Verify Version
        id: ver
        shell: bash
        run: |
          VER=$(tr -d '\r\n ' < VERSION)
          if [ -z "$VER" ]; then
            echo "::error::VERSION file is empty."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VER" ]]; then
            echo "::error::Tag ${GITHUB_REF} does not match VERSION ${VER}."
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Release Keystore
        id: keystore
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUIRE_RELEASE_KEYSTORE: ${{ vars.REQUIRE_RELEASE_KEYSTORE }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
            keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "${ANDROID_KEYSTORE_PASS:-gravityssh}" -alias "${ANDROID_KEY_ALIAS:-gravityssh}" >/dev/null
            echo "ephemeral=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 secret is not available in pull_request; using an ephemeral signing keystore for PR verification only."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" \
              -storepass gravityssh -keypass gravityssh -alias gravityssh \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=GravitySSH, OU=Mobile, O=GravitySSH, L=Net, S=Net, C=US"
            echo "ephemeral=true" >> "$GITHUB_OUTPUT"
          elif [ "$REQUIRE_RELEASE_KEYSTORE" = "true" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is empty while REQUIRE_RELEASE_KEYSTORE=true on event '${EVENT_NAME}' (${GITHUB_REF}). Refusing to sign a release APK with an ephemeral keystore."
            exit 1
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret is not configured; using an ephemeral signing keystore. Configure ANDROID_KEYSTORE_B64 and set repository variable REQUIRE_RELEASE_KEYSTORE=true to lock down upgrade signatures."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" \
              -storepass gravityssh -keypass gravityssh -alias gravityssh \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=GravitySSH, OU=Mobile, O=GravitySSH, L=Net, S=Net, C=US"
            echo "ephemeral=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Unit Tests, Lint & Build Release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          EPHEMERAL_SIGNING: ${{ steps.keystore.outputs.ephemeral }}
        run: |
          set -o pipefail
          if [ "$EPHEMERAL_SIGNING" = "true" ]; then
            export ANDROID_KEYSTORE_PASS="gravityssh"
            export ANDROID_KEY_ALIAS="gravityssh"
            export ANDROID_KEY_PASS="gravityssh"
          else
            export ANDROID_KEYSTORE_PASS="${ANDROID_KEYSTORE_PASS:-gravityssh}"
            export ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS:-gravityssh}"
            export ANDROID_KEY_PASS="${ANDROID_KEY_PASS:-gravityssh}"
          fi
          gradle testDebugUnitTest lintDebug assembleRelease --build-cache --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Emit Failure Annotations
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/gradle.log" ]; then
            { grep -E 'e: file://|FAILURE:|FAILED|Execution failed|What went wrong|Exception|Unresolved reference|AssertionError|java\.lang\.|Overload resolution|error:' "$RUNNER_TEMP/gradle.log" || true; } \
              | head -n 40 \
              | while IFS= read -r line; do
                  clean="${line//%/%25}"
                  clean="${clean//$'\r'/}"
                  echo "::error::${clean:0:400}"
                done
          fi

      - name: Package Release Artifacts
        id: pkg
        shell: bash
        run: |
          VER=$(tr -d '\r\n ' < VERSION)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          RELEASE_APK="dist/GravitySSH-Android-v${VER}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RELEASE_APK"
          APK_BYTES=$(stat -c%s "$RELEASE_APK")
          APK_MB=$(awk -v b="$APK_BYTES" 'BEGIN { printf "%.2f", b / 1048576 }')
          echo "Release APK size: ${APK_MB} MB (${APK_BYTES} bytes)"
          (cd dist && sha256sum "GravitySSH-Android-v${VER}-release.apk" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gravityssh-android-v${{ steps.pkg.outputs.version }}
          path: dist/*

  release:
    needs: build
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: release-pipeline
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check Existing Release Tag
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VER" ]]; then
            echo "::error::Tag ${GITHUB_REF} does not match VERSION ${VER}."
            exit 1
          fi
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
              echo "Release ${TAG} already exists; skipping automatic release on main."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download Build Artifacts
        if: steps.check.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: gravityssh-android-v${{ needs.build.outputs.version }}
          path: dist

      - name: Publish GitHub Release
        if: steps.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GravitySSH Android ${{ needs.build.outputs.tag }}
          body: ${{ needs.build.outputs.ephemeral_signing == 'true' && '> ⚠️ **签名提醒**：仓库尚未配置 `ANDROID_KEYSTORE_B64` Secret，本版本使用临时密钥签名。如需后续版本保留数据覆盖安装，请先在仓库 Secrets 配置固定 Keystore 并设置 Variable `REQUIRE_RELEASE_KEYSTORE=true`。' || '' }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/GravitySSH-Android-v${{ needs.build.outputs.version }}-release.apk
            dist/SHA256SUMS.txt
